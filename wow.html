<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f8445c, #f8445c);
    }

    .container {
      background: white;
      padding: 40px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
    }

    .container h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .container p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-box {
      width: 100%;
      margin-bottom: 20px;
    }

    .input-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-box input:focus {
      border-color: #f8445c;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #f8445c;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f8445c;
    }

    .back-link {
      display: block;
      margin-top: 18px;
      text-decoration: none;
      color: #f8445c;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Forgot Password?</h2>
    <p>Enter your email address and we'll send you a reset link.</p>

    <form>
      <div class="input-box">
        <input type="email" placeholder="Enter your email" required />
      </div>

      <button type="submit" class="btn">Reset Password</button>
    </form>

    <a href="ani.html" class="back-link">Back to Login</a>
  </div>

</body>
</html>
